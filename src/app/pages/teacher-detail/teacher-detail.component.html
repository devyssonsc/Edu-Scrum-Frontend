<div class="detail-container">
    
    <div class="header-row">
        <button class="btn-back" routerLink="/admin-dashboard">
            <i class="bi bi-arrow-left"></i> Back
        </button>
        <h1>Manage Teacher: <span class="highlight">{{ teacherId }}</span></h1>
    </div>


    <div class="stats-row">
        <app-stats-card 
            title="Courses" 
            [value]="mockTeacherData.stats.coursesCount" 
            description="currently teaching"
            iconClass="bi bi-book">
        </app-stats-card>

        <app-stats-card 
            title="Total Students" 
            [value]="mockTeacherData.stats.totalStudents" 
            description="in all classes"
            iconClass="bi bi-people">
        </app-stats-card>
    </div>


    <form [formGroup]="teacherForm" (ngSubmit)="onSubmit()" class="edit-section card">
        
        <div class="section-header">
            <h3>Teacher Data</h3>
            <button type="submit" class="btn btn-primary" [disabled]="teacherForm.invalid || !teacherForm.dirty">
                Save Changes
            </button>
        </div>

    
        <div class="form-row-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="form-group-main">
                <label>Full Name</label>
                <input type="text" formControlName="name" class="main-input">
            </div>
            
            <div class="form-group-main">
                <label>Institutional Email</label>
                <input type="text" formControlName="email" class="main-input">
            </div>
        </div>

        <hr class="divider">

        <h4 class="table-title">Courses Taught</h4>
        
        <div class="table-container">
            <table class="edit-table">
                <thead>
                    <tr>
                        <th>Course</th>
                    </tr>
                </thead>
                <tbody formArrayName="courses">
                    @for (item of courses.controls; track $index; let i = $index) {
                        <tr [formGroupName]="i">
                            <td>
                                <input type="text" formControlName="name" class="table-input" readonly>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>

    </form>
</div>
