<div class="detail-container">

    <div class="header-row">
        <button class="btn-back" routerLink="/admin-dashboard">
            <i class="bi bi-arrow-left"></i> Back
        </button>
        <h1>Manage Course: <span class="highlight">{{ courseName }}</span></h1>
    </div>

    <div class="stats-row">
        <app-stats-card 
            title="Students" 
            [value]="mockCourseData.stats.studentsCount.toString()" 
            description="enrolled"
            iconClass="bi bi-people-fill">
        </app-stats-card>

        <app-stats-card 
            title="Teaching Team" 
            [value]="mockCourseData.stats.teachersCount.toString()" 
            description="teachers"
            iconClass="bi bi-person-badge-fill">
        </app-stats-card>
    </div>

    <form [formGroup]="courseForm" (ngSubmit)="onSubmit()" class="edit-section card">
        
        <div class="section-header">
            <h3>Course Data</h3>
            <button type="submit" class="btn btn-primary" [disabled]="courseForm.invalid || !courseForm.dirty">
                Save Changes
            </button>
        </div>

        <div class="form-row-grid">
            <div class="form-group-main">
                <label>Course Name</label>
                <input type="text" formControlName="name" class="main-input">
            </div>
            
            <div class="form-group-main">
                <label>Associated Degree</label>
                <select formControlName="degreeId" class="main-input">
                    <option [ngValue]="null" disabled>Select a Degree...</option>
                    @for (degree of allDegrees; track degree.id) {
                        <option [value]="degree.id">{{ degree.name }}</option>
                    }
                </select>
            </div>
        </div>

        <hr class="divider">

        <h4 class="table-title">Teaching Team</h4>

        <div class="add-section">
            <div class="inline-add">
                <select [formControl]="selectedTeacherId" class="inline-select">
                    <option [ngValue]="null" disabled>Select a teacher to add...</option>
                    @for (t of availableTeachersToAdd; track t.id) {
                        <option [ngValue]="t.id">{{ t.name }}</option>
                    }
                </select>
                <button type="button" class="btn-icon add-btn" (click)="addTeacher()" 
                        [disabled]="!selectedTeacherId.value" title="Add Teacher">
                    <i class="bi bi-plus-circle-fill"></i>
                </button>

                
            </div>
        </div>
        
        <div class="table-container">
            <table class="edit-table">
                <thead>
                    <tr>
                        <th>Teacher Name</th>
                        <th>Institutional Email</th>
                        <th style="width: 50px;">Actions</th>
                    </tr>
                </thead>
                <tbody formArrayName="teachers">
                    @for (item of teachers.controls; track $index; let i = $index) {
                        <tr [formGroupName]="i">
                            <td>
                                <input type="text" formControlName="name" class="table-input" readonly>
                            </td>
                            <td>
                                <input type="text" formControlName="email" class="table-input" readonly>
                            </td>
                            <td class="actions">
                                <i class="bi bi-trash delete-icon" (click)="removeTeacher(i)"></i>
                            </td>
                        </tr>
                    }
                    @if (teachers.length === 0) {
                        <tr>
                            <td colspan="3" class="empty-row">No teachers assigned to this course.</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>

    </form>
</div>
