<div class="div-container">
    <form class="card form-card login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <h2 class="form-title">Edu Scrum Awards</h2>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" formControlName="email" placeholder="Ex: ana.silva">
            @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
                <small class="error-msg">This field is required.</small>
            }
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" formControlName="password" placeholder="********">
            @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
                <small class="error-msg">This field is required.</small>
            }
        </div>
        <hr class="divider">
        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
            Login
        </button>
    </form>
</div>
