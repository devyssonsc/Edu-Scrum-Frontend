<div class="div-container">

    <div class="page-header">
        <h1>Professor</h1>
        <p class="subtitle">{{ teacherName }}</p>
    </div>

    <div class="stats-cards">
        <app-stats-card title="Courses" [value]="countCourses" description="active courses"
            iconClass="bi bi-book"></app-stats-card>
        <app-stats-card title="Projects" [value]="countProjects" description="ongoing projects"
            iconClass="bi bi-kanban"></app-stats-card>
        </div>
    
    <app-section-selector [options]="['Courses', 'Projects', 'Awards']"
        (selectedOption)="onSelectOption($event)">
    </app-section-selector>
    
    <div class="card show-all">
        <div class="content">
            <h3>Manage {{ selectedOption }}</h3>
            <p>Overview of your {{ selectedOption.toLowerCase() }}</p>
            
            <div class="div-table">
                <app-show-table 
                    [data]="data" 
                    (editRow)="handleEdit($event)"
                    (deleteRow)="handleDelete($event)"
                    [showEdit]="true"
                    [showDelete]="selectedOption !== 'Courses'">
                </app-show-table>
            </div>
            
            </div>
    </div>
</div>
