<div class="div-container">
    <div class="stats-cards">
        <app-stats-card title="Cursos" [value]="countDegrees" description="cursos registados"
            iconClass="bi bi-mortarboard-fill"></app-stats-card>
        <app-stats-card title="Cadeiras" [value]="countCourses" description="cadeiras disponíveis"
            iconClass="bi bi-book"></app-stats-card>
        <app-stats-card title="Estudantes" [value]="countStudents" description="estudantes inscritos"
            iconClass="bi bi-people-fill"></app-stats-card>
        <app-stats-card title="Professores" [value]="countTeachers" description="professores ativos"
            iconClass="bi bi-person-badge-fill"></app-stats-card>
    </div>
    
    <app-section-selector [options]="['Cursos', 'Cadeiras', 'Estudantes', 'Professores']"
        (selectedOption)="onSelectOption($event)">
    </app-section-selector>
    
    <div class="card show-all">
        <div class="content">
            <h3>Gestão de {{ selectedOption }}</h3>
            <p>Registar e gerir {{ selectedOption.toLowerCase() }} da universidade</p>
            
            <div class="div-table">
                <app-show-table 
                    [data]="data" 
                    (editRow)="handleEdit($event)"
                    (deleteRow)="handleDelete($event)"
                    [showEdit]="true"
                    [showDelete]="true">
                </app-show-table>
            </div>
            
            <button class="btn btn-primary" (click)="onAddClick()">Adicionar {{ selectedOption }}</button>
        </div>
    </div>
</div>
