<div class="detail-container">
    
    <div class="header-row">
        <button class="btn-back" routerLink="/admin-dashboard">
            <i class="bi bi-arrow-left"></i> Voltar
        </button>
        <h1>Gerir Curso: <span class="highlight">{{ courseId }}</span></h1>
    </div>

    <div class="stats-row">
        <app-stats-card 
            title="Estudantes" 
            [value]="mockDegreeData.stats.studentsCount" 
            description="inscritos neste curso"
            iconClass="bi bi-people-fill">
        </app-stats-card>

        <app-stats-card 
            title="Professores" 
            [value]="mockDegreeData.stats.teachersCount" 
            description="a lecionar neste curso"
            iconClass="bi bi-person-badge-fill">
        </app-stats-card>

        <app-stats-card 
            title="Cadeiras" 
            [value]="mockDegreeData.stats.coursesCount" 
            description="total no plano"
            iconClass="bi bi-book">
        </app-stats-card>
    </div>

    <form [formGroup]="degreeForm" (ngSubmit)="onSubmit()" class="edit-section card">
        
        <div class="section-header">
            <h3>Dados do Curso</h3>
            <button type="submit" class="btn btn-primary" [disabled]="degreeForm.invalid || !degreeForm.dirty">
                Guardar Alterações
            </button>
        </div>

        <div class="form-group-main">
            <label>Designação do Curso</label>
            <input type="text" formControlName="name" class="main-input">
        </div>

        <hr class="divider">

        <h4 class="table-title">Gestão de Cadeiras</h4>
        
        <div class="table-container">
            <table class="edit-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">Código</th>
                        <th>Nome da Cadeira</th>
                        <th style="width: 50px;">Ações</th>
                    </tr>
                </thead>
                <tbody formArrayName="cadeiras">
                    @for (item of cadeiras.controls; track $index; let i = $index) {
                        <tr [formGroupName]="i">
                            <td>
                                <input type="text" formControlName="code" class="table-input code-input">
                            </td>
                            <td>
                                <input type="text" formControlName="name" class="table-input">
                            </td>
                            <td class="actions">
                                <i class="bi bi-trash delete-icon" (click)="removeCadeira(i)"></i>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>

    </form>
</div>
