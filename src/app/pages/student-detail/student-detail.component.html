<div class="div-container">
    
    <div class="header-row">
        <button class="btn-back" routerLink="/admin-dashboard" [queryParams]="{ tab: 'Students' }">
            <i class="bi bi-arrow-left"></i> Back
        </button>
        <h1>Manage Student: <span class="highlight">{{ studentName }}</span></h1>
    </div>

    <form [formGroup]="studentForm" (ngSubmit)="onSubmit()" class="edit-section card">
        
        <div class="section-header">
            <h3>Personal Data</h3>
            <button type="submit" class="btn btn-primary" [disabled]="studentForm.invalid || !studentForm.dirty">
                Save Changes
            </button>
        </div>

        <div class="form-row-grid">
            <div class="form-group-main">
                <label>Full Name</label>
                <input type="text" formControlName="name" class="main-input">
            </div>
            
            <div class="form-group-main">
                <label>Institutional Email</label>
                <input type="text" formControlName="email" class="main-input">
                @if (studentForm.get('email')?.hasError('duplicate')) {
                    <small style="color: #e74c3c; font-size: 0.8rem;">Email already in use.</small>
                }
            </div>

            <div class="form-group-main">
                <label>Current Degree</label>
                <select formControlName="degreeId" class="main-input">
                    <option [ngValue]="null" disabled>Select a Degree...</option>
                    @for (degree of allDegrees; track degree.id) {
                        <option [value]="degree.id">{{ degree.name }}</option>
                    }
                </select>
            </div>
        </div>

        <hr class="divider">

        <h4 class="table-title">Course Enrollments</h4>
        
        <div class="table-container">
            <table class="edit-table">
                <thead>
                    <tr>
                        <th>Course</th>
                        <th style="width: 15%">Final Grade</th>
                        <th style="width: 50px;">Actions</th>
                    </tr>
                </thead>
                <tbody formArrayName="courses">
                    @for (item of courses.controls; track $index; let i = $index) {
                        <tr [formGroupName]="i">
                            <td>
                                <input type="text" formControlName="name" class="table-input" readonly>
                            </td>
                            <td>
                                <input type="text" formControlName="grade" class="table-input center-text">
                            </td>
                            <td class="actions">
                                <i class="bi bi-trash delete-icon" (click)="removeCourse(i)"></i>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>

    </form>
</div>
