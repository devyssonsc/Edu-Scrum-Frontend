<div class="div-container">

    <div class="header">
        <button class="btn-back" routerLink="/teacher-dashboard">
            <i class="bi bi-arrow-left"></i> Back
        </button>
        <h1>
            <span class="subtitle">{{ courseData.code }}</span> 
            {{ courseData.name }}
        </h1>
        <p class="degree-name">{{ courseData.degree }}</p>
    </div>

    <div class="stats-cards">
        <app-stats-card 
            title="Enrolled Students" 
            [value]="courseData.stats.totalStudents" 
            description="this semester"
            iconClass="bi bi-people-fill">
        </app-stats-card>

        <app-stats-card 
            title="Active Projects" 
            [value]="courseData.stats.activeProjects" 
            description="currently running"
            iconClass="bi bi-kanban">
        </app-stats-card>

        <app-stats-card 
            title="Teams" 
            [value]="courseData.stats.totalTeams" 
            description="formed"
            iconClass="bi bi-microsoft-teams">
        </app-stats-card>
    </div>

    <div class="card show-all">
        <div class="content">
            
            <div class="section-header">
                <h2>Course Projects</h2>
                <p>Manage projects and teams</p>
            </div>

            <div class="div-table">
                <app-show-table 
                    [data]="courseData.projects"
                    (editRow)="handleProjectClick($event)"
                    [showDelete]="false">
                </app-show-table>
            </div>

            <button class="btn btn-primary" (click)="createProject()">
                Create New Project
            </button>

        </div>
    </div>
</div>
