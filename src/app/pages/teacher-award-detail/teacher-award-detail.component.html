<div class="detail-container">
    
    <div class="header-row">
        <button class="btn-back" routerLink="/teacher-dashboard" [queryParams]="{ tab: 'Awards' }">
            <i class="bi bi-arrow-left"></i> Back
        </button>
        <h1>Manage Award: <span class="highlight">{{ award?.name }}</span></h1>
    </div>

    <div class="stats-row">
        <app-stats-card title="Value" [value]="(award?.points || 0).toString()" description="points earned" iconClass="bi bi-star-fill"></app-stats-card>
        <app-stats-card title="Assignments" [value]="assignmentsCount.toString()" description="total recipients" iconClass="bi bi-person-check-fill"></app-stats-card>
        <app-stats-card title="Type" [value]="award?.type || 'N/A'" description="award type" iconClass="bi bi-globe"></app-stats-card>
    </div>

    <form [formGroup]="editForm" (ngSubmit)="onSaveEdit()" class="edit-section card">
        
        <div class="section-header">
            <h3>Award Data</h3>
            <div class="actions" style="display: flex; gap: 1rem;">
                @if (award?.type === 'MANUAL') {
                    <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || !editForm.dirty">
                        Save Changes
                    </button>
                }
            </div>
        </div>

        <div class="form-group-main">
            <label>Award Name</label>
            <input type="text" formControlName="name" class="main-input" [readonly]="award?.type === 'MANUAL'">
        </div>

        <div class="form-group-main" style="margin-top: 1rem;">
            <label>Description</label>
            <textarea formControlName="description" class="main-input" [readonly]="award?.type === 'MANUAL'" rows="4"></textarea>
        </div>

        <div class="form-group-main" style="margin-top: 1rem;">
            <label>Associated Course</label>
            @if (award?.type === 'MANUAL') {
                <input type="text" value="Global Award (All Courses)" class="main-input" readonly>
            } @else {
                <select formControlName="courseId" class="main-input">
                    @for (course of myCourses; track course.id) {
                        <option [ngValue]="course.id">{{ course.name }}</option>
                    }
                </select>
            }
        </div>

        <div class="form-group-main" style="margin-top: 1rem;">
            <label>Points Value</label>
            <input [type]="award?.type === 'MANUAL' ? 'text' : 'number'" 
                   formControlName="points" 
                   class="main-input" 
                   [readonly]="award?.type === 'MANUAL'" 
                   min="1" max="5">
        </div>

    </form>
</div>
