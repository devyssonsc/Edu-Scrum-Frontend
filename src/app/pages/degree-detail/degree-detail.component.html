<div class="detail-container">
    
    <div class="header-row">
        <button class="btn-back" routerLink="/admin-dashboard">
            <i class="bi bi-arrow-left"></i> Back
        </button>
        <h1>Manage Degree</h1>
    </div>

    <div class="stats-row">
        <app-stats-card 
            title="Students" 
            [value]="stats.studentsCount" 
            description="enrolled in this degree"
            iconClass="bi bi-people-fill">
        </app-stats-card>

        <app-stats-card 
            title="Teachers" 
            [value]="stats.teachersCount" 
            description="teaching in this degree"
            iconClass="bi bi-person-badge-fill">
        </app-stats-card>

        <app-stats-card 
            title="Courses" 
            [value]="stats.coursesCount" 
            description="total in syllabus"
            iconClass="bi bi-book">
        </app-stats-card>
    </div>

    <form [formGroup]="degreeForm" (ngSubmit)="onSubmit()" class="edit-section card">
        
        <div class="section-header">
            <h3>Degree Data</h3>
            <button type="submit" class="btn btn-primary" [disabled]="degreeForm.invalid || !degreeForm.dirty">
                Save Changes
            </button>
        </div>

        <div class="form-group-main">
            <label>Degree Name</label>
            <input type="text" formControlName="name" class="main-input">
        </div>

        <hr class="divider">

        <h4 class="table-title">Manage Courses</h4>
        
        <div class="table-container">
            <table class="edit-table">
                <thead>
                    <tr>
                        <th>Course Name</th>
                        <th style="width: 50px;">Actions</th>
                    </tr>
                </thead>
                <tbody formArrayName="cadeiras">
                    @for (item of cadeiras.controls; track $index; let i = $index) {
                        <tr [formGroupName]="i">
                            <td>
                                <input type="text" formControlName="name" class="table-input" readonly>
                            </td>
                            <td class="actions">
                                <i class="bi bi-trash delete-icon" (click)="removeCadeira(i)"></i>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>

    </form>
</div>
