<div class="div-container">
    
    <form class="card form-card" [formGroup]="courseForm" (ngSubmit)="onSubmit()">
        
        <h2 class="form-title">Adicionar Cadeira</h2>

        <div class="form-group">
            <label for="name">Nome</label>
            <input type="text" id="name" formControlName="name" placeholder="Ex: Qualidade de Software">
            @if (courseForm.get('name')?.invalid && courseForm.get('name')?.touched) {
                <small class="error-msg">O nome é obrigatório.</small>
            }
        </div>

        <div class="form-group">
            <label for="degree">Curso (Degree)</label>
            <select
                [formControl]="selectedDegreeId"
                class="inline-input"
                [class.invalid]="selectedDegreeId.invalid && selectedDegreeId.touched"
                (change)="selectDegree()">
                <option [ngValue]="null" disabled>Selecione um curso...</option>
                @for (degree of allDegrees; track degree.id) {
                    <option [value]="degree.id">
                        {{ degree.name }}
                    </option>
                }
            </select>
        </div>

        <hr class="divider">

        <button type="submit" class="btn btn-primary" [disabled]="courseForm.invalid">
            Registar Cadeira
        </button>
    </form>
</div>
