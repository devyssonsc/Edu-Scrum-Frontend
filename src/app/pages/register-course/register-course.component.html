<div class="div-container">
    
    <div style="text-align: left; margin-bottom: 1rem;">
        <button class="btn-back" routerLink="/admin-dashboard" [queryParams]="{ tab: 'Courses' }">
            <i class="bi bi-arrow-left"></i> Back
        </button>
    </div>

    <form class="card form-card" [formGroup]="courseForm" (ngSubmit)="onSubmit()">
        
        <h2 class="form-title">Register Course</h2>

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" formControlName="name" placeholder="Ex: Software Quality">
            @if (courseForm.get('name')?.invalid && courseForm.get('name')?.touched) {
                <small class="error-msg">This field is required</small>
            }
        </div>

        <div class="form-group">
            <label for="degree">Degree</label>
            <select
                [formControl]="selectedDegreeId"
                class="inline-input"
                [class.invalid]="selectedDegreeId.invalid && selectedDegreeId.touched"
                (change)="selectDegree()">
                <option [ngValue]="null" disabled>Select a Degree...</option>
                @for (degree of allDegrees; track degree.id) {
                    <option [value]="degree.id">
                        {{ degree.name }}
                    </option>
                }
            </select>
        </div>

        <hr class="divider">

        <button type="submit" class="btn btn-primary" [disabled]="courseForm.invalid">
            Register Course
        </button>
    </form>
</div>
