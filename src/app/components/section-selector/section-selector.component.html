<div class="selector-container" [style.--options-count]="options.length">
    
    <div class="selected" [style.left]="getLeftPosition()"></div>

    @for (option of options; track option) {
        <div class="option" 
             [class.active]="option === activeOption"
             (click)="selectOption(option)">
            <p>{{ option }}</p>
        </div>
    }
</div>
